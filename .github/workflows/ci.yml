name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lua build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libreadline-dev
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.4
      - run: mise run ci
      - if: runner.os == 'Linux'
        run: mise run integration
